services:
  postgres:
    image: postgres:16-alpine
    container_name: toktickit-postgres
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-toktickit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toktickit}
      POSTGRES_DB: ${POSTGRES_DB:-toktickit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: toktickit-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      - postgres

volumes:
  postgres_data: